<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0A0A0A; color: #fff; font-family: var(--sans); display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px; }
  .wrap { max-width: 480px; display: flex; flex-direction: column; align-items: center; }
  /* Wordmark: gold EDGE + white WITHIN in Anton, matching the cover art */
  .wordmark {
    display: inline-flex; flex-direction: column; align-items: flex-start;
    text-decoration: none; line-height: 1;
  }
  .wordmark:hover, .wordmark:focus { text-decoration: none !important; }
  .wm-word {
    font-family: 'Anton', Impact, sans-serif; font-weight: 400;
    font-size: 24px; line-height: 1; letter-spacing: 0; text-transform: uppercase;
    white-space: nowrap;
  }
  .wm-edge { color: #b8860b; }
  .wm-within { color: #FFFFFF; }
  .wm-sub {
    font-family: var(--sans); font-size: 8px; font-weight: 700; line-height: 1;
    letter-spacing: 0.42em; text-transform: uppercase; color: #bdbdbd;
    margin-top: 4px; white-space: nowrap;
  }
  .wordmark--lg .wm-word { font-size: 30px; }
  .wordmark--lg .wm-sub { font-size: 9.5px; margin-top: 5px; }
  /* On a light background: WITHIN (and the sub line) go dark so they stay readable */
  .wordmark--on-light .wm-within { color: #0A0A0A; }
  .wordmark--on-light .wm-sub { color: #555555; }
  .wordmark { margin-bottom: 36px; }
  .num { font-size: 96px; font-weight: 700; color: #b8860b; line-height: 1; font-family: var(--serif); }
  h1 { font-size: 24px; color: #fff; margin: 16px 0 10px; }
  p { font-size: 15px; color: #8a8a8a; line-height: 1.7; margin-bottom: 32px; }
  .btn { display: inline-block; background: #b8860b; color: #0A0A0A; font-weight: 700; font-size: 14px; padding: 13px 28px; border-radius: 6px; text-decoration: none; letter-spacing:0.01em;  font-family: var(--sans); }
  a:focus-visible { outline: 2px solid #b8860b; outline-offset: 3px; }
.btn{min-height:44px;display:inline-flex !important;align-items:center}.nf-links{list-style:none;margin:28px 0 0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px}.nf-links a{color:#EDE6DA;font-family:var(--sans);font-size:15px;min-height:44px;display:inline-flex;align-items:center;text-underline-offset:3px}
</style>
